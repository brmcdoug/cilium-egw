apiVersion: isovalent.com/v1alpha1
kind: IsovalentBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: cluster00-wkr00
  bgpInstances:
  - name: "65010"
    localASN: 65010
    peers:
    - name: "r99"
      peerASN: 65005
      peerAddress: 10.0.0.99
      peerConfigRef:
        name: "cilium-peer"

