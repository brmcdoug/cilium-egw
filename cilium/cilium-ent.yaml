hubble:
  enabled: false
  relay:
    enabled: false
nodeinit:
  enabled: true
debug:
  enabled: true
ipv6:
  enabled: true
bpf:
  masquerade: true  # Default to 'false'.
egressGateway:
  enabled: true
bgpControlPlane:
  enabled: true
  egressGateway:
    enabled: true
    installRoutes: true
enterprise:
  egressGatewayHA:
    enabled: true
envoy:
  enabled: true
  extraArgs:
  - --component-log-level http:debug,http2:debug,filter:debug,conn_handler:debug,router:debug,connection:debug,upstream:debug,pool:debug
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
gatewayAPI:
  enabled: true
k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.0.0.0/8
ipv6NativeRoutingCIDR: c::/32
kubeProxyReplacement: true  # Defaults to 'false'.