apiVersion: isovalent.com/v1alpha1
kind: IsovalentBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/hostname: k8s-wkr01
  bgpInstances:
  - name: "instance-65102"
    staticRoutes:
      - cidr: "192.150.9.124/30"
    localASN: 65102
    peers:
    - name: "dci-xrd05"
      peerASN: 65000
      peerAddress: 10.0.0.5
      peerConfigRef:
        name: "cilium-peer"
    prefixAdvertisements:
      - cidr: "192.150.9.124/30"

