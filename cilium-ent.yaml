hubble:
  enabled: false
  relay:
    enabled: false
nodeinit:
  enabled: true
debug:
  enabled: true
ipv6:
  enabled: true
bpf:
  masquerade: true  # Default to 'false'.
enterprise:
  featureGate:
    approved:
    - SRv6
    - EnterpriseBGPControlPlane
    - EgressGatewayHA
    - EgressGatewayIPv4
  egressGatewayHA:
    enabled: true  # Defaults to 'false'.
  srv6:
    enabled: true
    encapMode: reduced
    locatorPoolEnabled: true
  bgpControlPlane:
    enabled: true
k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true
ipam:
  mode: kubernetes
ipv4NativeRoutingCIDR: 10.0.0.0/8
ipv6NativeRoutingCIDR: c::/32
kubeProxyReplacement: true  # Defaults to 'false'.