#   The cilium/topology.yaml launches a small nexus 9000v clos fabric with 
#   Linux bridge instances for attachment of VMs running K8s and Cilium CNI

name: egw

mgmt:
  network: mgtnet
  ipv4-subnet: 172.20.1.0/24

topology:
  nodes:

    r00:
      kind: cisco_n9kv
      image: vrnetlab/cisco_nxos9000v:10.5.2
      mgmt-ipv4: 172.20.1.100
      startup-config: nx-config/r00.cfg

    r01:
      kind: cisco_n9kv
      image: vrnetlab/cisco_nxos9000v:10.5.2
      mgmt-ipv4: 172.20.1.101
      startup-config: nx-config/r01.cfg

    r02:
      kind: cisco_n9kv
      image: vrnetlab/cisco_nxos9000v:10.5.2
      mgmt-ipv4: 172.20.1.102
      startup-config: nx-config/r02.cfg

    r03:
      kind: cisco_n9kv
      image: vrnetlab/cisco_nxos9000v:10.5.2
      mgmt-ipv4: 172.20.1.103
      startup-config: nx-config/r03.cfg

    r04:
      kind: cisco_n9kv
      image: vrnetlab/cisco_nxos9000v:10.5.2
      mgmt-ipv4: 172.20.1.104
      startup-config: nx-config/r04.cfg

    r05:
      kind: cisco_xrd
      image: ios-xr/xrd-control-plane:24.4.1
      mgmt-ipv4: 172.20.1.105
      startup-config: nx-config/r05.cfg

    k8s-cp-net:
      kind: bridge

    k8s-blue-net1:
      kind: bridge

    k8s-blue-net2:
      kind: bridge

    k8s-green-net1:
      kind: bridge

    k8s-green-net2:
      kind: bridge

    k8s-wkr0-net:
      kind: bridge

  links:
    - endpoints: ["r00:eth1", "r02:eth1"]
    - endpoints: ["r00:eth2", "r03:eth1"]
    - endpoints: ["r00:eth3", "r04:eth1"]

    - endpoints: ["r01:eth1", "r02:eth2"]
    - endpoints: ["r01:eth2", "r03:eth2"]
    - endpoints: ["r01:eth3", "r04:eth2"]
    
    - endpoints: ["r02:eth3", "k8s-cp-net:r02-eth3"]
    - endpoints: ["r02:eth4", "r05:Gi0-0-0-0"]
    - endpoints: ["r02:eth5", "r05:Gi0-0-0-1"]

    - endpoints: ["r03:eth3", "k8s-green-net1:r03-eth3"]
    - endpoints: ["r03:eth4", "k8s-blue-net1:r03-eth4"]

    - endpoints: ["r04:eth3", "k8s-wkr0-net:r04-eth3"]
    - endpoints: ["r04:eth4", "k8s-green-net2:r04-eth4"]
    - endpoints: ["r04:eth5", "k8s-blue-net2:r04-eth5"]


