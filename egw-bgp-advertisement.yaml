apiVersion: isovalent.com/v1alpha1
kind: IsovalentBGPAdvertisement
metadata:
  name: egw-advertisement
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: "EgressGateway"
      selector:
        matchExpressions:
          - { key: egw, operator: In, values: [ bgp-advertise ] } 