apiVersion: isovalent.com/v1
kind: IsovalentEgressGatewayPolicy
metadata:
  name: egress-red
  labels:
    advertise: bgp-red
spec:
  selectors:
  - podSelector:
      matchLabels:
        io.kubernetes.pod.namespace: testns
  destinationCIDRs:
  - "10.12.2.0/25"
  egressCIDRs:
  - "10.27.248.16/31"
  egressGroups:
    - nodeSelector:
        matchLabels:
          egress-node: "red"   
