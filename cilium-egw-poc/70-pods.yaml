
---
kind: Namespace
apiVersion: v1
metadata:
  name: testns
  labels:
    name: testns

---
apiVersion: v1
kind: Pod
metadata:
  namespace: testns
  labels:
    app: alpine-ping
  name: testpod0
spec:
  containers:
  - image: iejalapeno/alpine:latest
    imagePullPolicy: IfNotPresent
    name: testpod0
    command:
      - /bin/sh
      - "-c"
      - "sleep 60m"

