
---
kind: Namespace
apiVersion: v1
metadata:
  name: testns1
  labels:
    name: testns1

---
kind: Namespace
apiVersion: v1
metadata:
  name: testns2
  labels:
    name: testns2

---
apiVersion: v1
kind: Pod
metadata:
  namespace: testns1
  labels:
    app: alpine-ping
  name: testpod1
spec:
  containers:
  - image: iejalapeno/alpine:latest
    imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
    name: testpod1
    command:
      - /bin/sh
      - "-c"
      - "sleep 60m"

---
apiVersion: v1
kind: Pod
metadata:
  namespace: testns2
  labels:
    app: alpine-ping
  name: testpod1
spec:
  containers:
  - image: alpine:latest
    imagePullPolicy: IfNotPresent
    name: testpod2
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
    command:
      - /bin/sh
      - "-c"
      - "sleep 60m"


