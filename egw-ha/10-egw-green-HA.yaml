apiVersion: isovalent.com/v1
kind: IsovalentEgressGatewayPolicy
metadata:
  name: egress-green
  labels:
    advertise: bgp-green
spec:
  selectors:
  - podSelector: {}
      # matchLabels:
      #   io.kubernetes.pod.namespace: testns
  destinationCIDRs:
  - "0.0.0.0/0"
  egressCIDRs:
  - "192.150.9.124/31"
  excludedCIDRs:
  - "192.168.0.0/16"
  - "172.16.0.0/16" 
  egressGroups:
    - nodeSelector:
        matchLabels:
          egressnode: "green"   
      maxGatewayNodes: 2 
