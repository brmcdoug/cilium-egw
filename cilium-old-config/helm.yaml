cilium:
#  image:
#    repository: quay.io/isovalent-dev/cilium-dev
#    tag: v1.16.7-cee.1-1289
  MTU: 1500
  agentNotReadyTaintKey: CiliumIsDown
  bgpControlPlane:
    enabled: true
  bpf:
    masquerade: true
  debug:
    enabled: true
    verbose: flow,datapath,envoy,policy
  egressGateway:
    enabled: true
    installRoutes: true
  enterprise:
    egressGatewayHA:
      enabled: true
  envoy:
    enabled: true
    extraArgs:
    - --component-log-level http:debug,http2:debug,filter:debug,conn_handler:debug,router:debug,connection:debug,upstream:debug,pool:debug
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  gatewayAPI:
    enabled: true
  hubble:
    enabled: true
    metrics:
      dashboards:
        annotations:
          grafana_folder: Hubble
        enabled: true
        namespace: kube-system
      enableOpenMetrics: true
      enabled:
      - tcp
      - icmp
      - policy
      - dns:query;ignoreAAAA;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload;sourceContext=workload-name|pod-name|dns|reserved-identity;destinationContext=workload-name|pod-name|dns|reserved-identity
      - drop:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload;sourceContext=workload-name|pod-name|dns|reserved-identity;destinationContext=workload-name|pod-name|dns|reserved-identity
      - flow:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload;sourceContext=workload-name|pod-name|dns|reserved-identity;destinationContext=workload-name|pod-name|dns|reserved-identity
      - flows-to-world:labelsContext=source_namespace,source_workload;sourceContext=workload-name|pod-name|dns|reserved-identity
      - httpV2:exemplars=true;labelsContext=source_namespace,source_workload,source_app,destination_namespace,destination_workload,destination_app,traffic_direction;sourceContext=workload-name|pod-name|dns|reserved-identity;destinationContext=workload-name|pod-name|dns|reserved-identity
      serviceMonitor:
        enabled: true
    relay:
      dialTimeout: 15s
      enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      retryTimeout: 15s
  ipam:
    mode: "cluster-pool"
    ciliumNodeUpdateRate: "15s"
    operator:
      clusterPoolIPv4PodCIDRList: ["172.16.0.0/16"]
  k8sServiceHost: apiserver-ethos11-dev-ut1.ethos.adobe.net
  k8sServicePort: 443
  kubeProxyReplacement: "true"
  nodePort:
    enabled: true
  nodeinit:
    enabled: true
  operator:
    enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      trustCRDsExist: true
hubble-enterprise:
  enabled: false
hubble-ui:
  enabled: false