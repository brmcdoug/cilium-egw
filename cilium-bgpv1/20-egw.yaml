apiVersion: isovalent.com/v1
kind: IsovalentEgressGatewayPolicy
metadata:
  labels:
    advertise: bgp-green
  name: egress-green
spec:
  destinationCIDRs:
  - 0.0.0.0/0
  egressCIDRs:
  - 192.150.9.124/31
  egressGroups:
  - nodeSelector:
      matchLabels:
        egressnode: "green"
  selectors:
  - podSelector:
      matchLabels:
        io.kubernetes.pod.namespace: blue

 
