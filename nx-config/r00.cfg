feature bgp 
feature vn-segment
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
nv overlay evpn

interface loopback0
  ip address 10.0.0.0/32

interface Ethernet1/1
  no switchport
  ip address 10.1.1.0/31
  no shutdown

interface Ethernet1/2
  no switchport
  ip address 10.1.1.2/31
  no shutdown

interface Ethernet1/3
  no switchport
  ip address 10.1.1.4/31
  no shutdown

router bgp 65000
  router-id auto
  address-family ipv4 unicast
    network 10.0.0.0/32
  neighbor 10.1.1.1
    remote-as 65002
    address-family ipv4 unicast
  neighbor 10.1.1.3
    remote-as 65003
    address-family ipv4 unicast
  neighbor 10.1.1.5
    remote-as 65004
    address-family ipv4 unicast

    
    