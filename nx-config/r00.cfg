feature bgp 

router bgp 4200000000
  router-id auto
  address-family ipv4 unicast
    network 10.0.0.0/32
  neighbor 10.1.1.1
    remote-as 4200000002
    address-family ipv4 unicast
  neighbor 10.1.1.3
    remote-as 4200000003
    address-family ipv4 unicast
  neighbor 10.1.1.5
    remote-as 4200000004
    address-family ipv4 unicast
  neighbor 10.1.1.7
    remote-as 4200000099
    address-family ipv4 unicast

interface loopback0
  ip address 10.0.0.0/32

interface Ethernet1/1
  no switchport
  ip address 10.1.1.0/31
  no shutdown

interface Ethernet1/2
  no switchport
  ip address 10.1.1.2/31
  no shutdown

interface Ethernet1/3
  no switchport
  ip address 10.1.1.4/31
  no shutdown

interface Ethernet1/4
  description to r99 RR
  no switchport
  ip address 10.1.1.6/31
  no shutdown
    
    