feature bgp 
feature vn-segment
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
nv overlay evpn

interface loopback0
  ip address 10.0.0.2/32

interface Ethernet1/1
  no switchport
  ip address 10.1.1.1/31
  no shutdown

interface Ethernet1/2
  no switchport
  ip address 10.1.1.9/31
  no shutdown

interface Ethernet1/3
  description k8s-cp
  no switchport
  ip address 10.10.10.1/24
  no shutdown

interface Ethernet1/4
  description to r05 DCI
  no shutdown

router bgp 65002
  router-id auto
  address-family ipv4 unicast
    network 10.0.0.2/32
    network 10.10.10.0/24

  neighbor 10.1.1.0
    remote-as 65000
    address-family ipv4 unicast
  neighbor 10.1.1.8
    remote-as 65001
    address-family ipv4 unicast

    
    