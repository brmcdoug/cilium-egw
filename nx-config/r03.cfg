feature bgp 

router bgp 65003
  router-id auto
  address-family ipv4 unicast
    network 10.0.0.3/32
    network 10.10.11.0/24
  neighbor 10.1.1.2
    remote-as 65000
    address-family ipv4 unicast
  neighbor 10.1.1.10
    remote-as 65001
    address-family ipv4 unicast

interface loopback0
  ip address 10.0.0.3/32

interface Ethernet1/1
  no switchport
  ip address 10.1.1.3/31
  no shutdown

interface Ethernet1/2
  no switchport
  ip address 10.1.1.11/31
  no shutdown

interface Ethernet1/3
  description k8s-wkr00
  no switchport
  ip address 10.10.11.1/24
  no shutdown
    
    