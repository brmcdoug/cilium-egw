feature bgp 
feature vn-segment
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
nv overlay evpn

interface loopback0
  ip address 10.0.0.4/32

interface Ethernet1/1
  no switchport
  ip address 10.1.1.5/31
  no shutdown

interface Ethernet1/2
  no switchport
  ip address 10.1.1.13/31
  no shutdown

interface Ethernet1/3
  description k8s-wkr0
  no switchport
  ip address 10.10.12.1/24
  no shutdown

interface Ethernet1/4
  description k8s0-egw-outside
  no shutdown

router bgp 65004
  router-id auto
  address-family ipv4 unicast
    network 10.0.0.4/32
    network 10.10.12.0/24
  neighbor 10.1.1.4
    remote-as 65000
    address-family ipv4 unicast
  neighbor 10.1.1.12
    remote-as 65001
    address-family ipv4 unicast


    
    