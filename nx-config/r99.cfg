hostname r99
username cisco
 group root-lr
 group cisco-support
 secret 10 $6$GXFSDMYr1txD....$09ETAo1VMaFVXEu9HMDuV9y8fpXbZIHhgWe8nqvxotAaOOaTCxsC8QBzp3g1aVHFZUOtPuLFeLOaL.XsIpQHw.
!
grpc
 port 57400
 no-tls
 address-family ipv4
 service-layer
 !
!
telemetry model-driven
 destination-group jalapeno
  address-family ipv4 172.20.1.1 port 32400
   encoding self-describing-gpb
   protocol grpc no-tls
  !
 !
 sensor-group cisco_models
 !
 sensor-group openconfig_interfaces
  sensor-path openconfig-interfaces:interfaces/interface
 !
 subscription base_metrics
  sensor-group-id cisco_models sample-interval 10000
  sensor-group-id openconfig_interfaces sample-interval 10000
  destination-id jalapeno
  source-interface MgmtEth0/RP0/CPU0/0
 !
!
call-home
 service active
 contact smart-licensing
 profile CiscoTAC-1
  active
  destination transport-method email disable
  destination transport-method http
 !
!
netconf-yang agent
 ssh
!
interface Loopback0
 ipv4 address 10.0.0.99 255.255.255.255
 ipv6 address fc00:0:1099::1/128
!
interface MgmtEth0/RP0/CPU0/0
 description mgt
 ipv4 address 172.20.1.199 255.255.255.0
!
interface GigabitEthernet0/0/0/0
 description to r00
 ipv4 address 10.1.1.7 255.255.255.254
 ipv6 address 2001:db8:1:1:1:1:1:0/127
!
interface GigabitEthernet0/0/0/1
 description to r01
 ipv4 address 10.1.1.15 255.255.255.254
 ipv6 address 2001:db8:1:1:1:1:1:2/127
!
route-policy drop
  drop
end-policy
!
route-policy pass
  pass
end-policy
!
router static
 address-family ipv4 unicast
  0.0.0.0/0 172.20.1.1
 !
!
router bgp 65000
 bgp router-id 10.0.0.99
 bgp bestpath as-path multipath-relax
 address-family ipv4 unicast
  additional-paths receive
  maximum-paths ebgp 32
  network 10.0.0.99/32
 !
 neighbor 10.1.1.6
  remote-as 65000
  address-family ipv4 unicast
   route-policy pass in
   route-policy pass out
  !
